<!DOCTYPE html>
<head>

<title>TIK TIK TRAVELS</title>
<link rel="stylesheet" href="3-in-one.css">

</head>
<body>

<div class="container">

<form id="tf">

<h1 class="title">TIK TIK TRAVELS</h1>
<br>
<h2>Distance Travel:</h2>
<input type="number" id="a1" min="0">

<br><br>

<h2>STUDENT DISCOUNT</h2>
<input type="radio" id="studentYes" name="student" value="yes">
<label for="studentYes">YES</label>

<br>

<input type="radio" id="studentNo" name="student" value="no">
<label for="studentNo">NO</label>

<br><br>

<input type="submit" value="Submit">
<h2>Cost of Travel:</h2>
<input type="number" id="a2" readonly>

<br><br>

<button type="button" onclick="location.href='shope-js.html'">T.T Shop</button>
<button type="button" onclick="location.href='index.html'">T.T MOVIE</button>

</form>
</div>

<script>
document.getElementById("tf").addEventListener("submit", function(sub){
sub.preventDefault();

let distance = Number(document.getElementById("a1").value);
let student = document.querySelector('input[name="student"]:checked').value;
let cost;

if (student === "yes")
{

if (distance >= 0 && distance <= 5) 
{
cost = 16;
}
else if (distance >= 6 && distance <= 15)
{
cost = 80;
}
else if (distance >= 16 && distance <= 30) 
{
cost = 160;
}
else {
cost = 240;
}
}

else {
if (distance >= 0 && distance <= 5) 
{
cost = 20;
}
else if (distance >= 6 && distance <= 15) 
{
cost = 100;
}
else if (distance >= 16 && distance <= 30) 
{
cost = 200;
}
else 
{
cost = 300;
}
}

document.getElementById("a2").value = cost;

});

</script>

</body>
</html>
